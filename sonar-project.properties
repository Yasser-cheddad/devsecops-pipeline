# ============================================================
#  SonarQube Project Configuration
#  PFa DevSecOps – EST Cybersécurité
# ============================================================

sonar.projectKey=pfe-devsecops
sonar.projectName=PFE DevSecOps Pipeline
sonar.projectVersion=2.0

# Source directories
sonar.sources=app,.semgrep
sonar.exclusions=**/node_modules/**,**/terraform/**,**/.git/**,**/reports/**

# Language settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.python.coverage.reportPaths=coverage.xml

# Quality Gate – fail pipeline if gate is RED
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Security hotspots
sonar.security.sources=app

# GitLab integration
sonar.scm.provider=git
sonar.links.ci=$CI_PROJECT_URL/-/pipelines
