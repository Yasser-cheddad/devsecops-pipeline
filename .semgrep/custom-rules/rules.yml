# ================================================================
#  Semgrep Custom Rules – PFE DevSecOps
#  3 règles personnalisées exigées par le cahier des charges
# ================================================================

rules:

  # ── Règle 1 : Hardcoded secrets in source code ─────────────
  - id: pfe-hardcoded-secret
    patterns:
      - pattern: $VAR = "$SECRET"
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i)(password|passwd|secret|api_key|apikey|token|auth|credential)
      - metavariable-regex:
          metavariable: $SECRET
          regex: .{8,}
    message: |
      Potential hardcoded secret in variable '$VAR'.
      Move secrets to environment variables or a secrets manager (AWS Secrets Manager).
    languages: [python, javascript, typescript]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-798"
      owasp: "A07:2021 – Identification and Authentication Failures"

  # ── Règle 2 : SQL Injection via string concatenation ────────
  - id: pfe-sql-injection
    patterns:
      - pattern: |
          $DB.execute("..." + $INPUT)
      - pattern: |
          $DB.execute(f"...{$INPUT}...")
      - pattern: |
          $DB.execute("..." % $INPUT)
    message: |
      Possible SQL injection via string concatenation in database query.
      Use parameterized queries: db.execute("SELECT * FROM users WHERE id = ?", (user_id,))
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-89"
      owasp: "A03:2021 – Injection"

  # ── Règle 3 : Insecure deserialization (pickle) ─────────────
  - id: pfe-insecure-deserialization
    patterns:
      - pattern: pickle.loads(...)
      - pattern: pickle.load(...)
    message: |
      Insecure deserialization using pickle.
      pickle.loads() can execute arbitrary code if data comes from untrusted sources.
      Use JSON or a safe serialization format instead.
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-502"
      owasp: "A08:2021 – Software and Data Integrity Failures"
