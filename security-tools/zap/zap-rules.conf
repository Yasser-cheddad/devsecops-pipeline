# ZAP Alert Filter Rules – PFa DevSecOps
# Format: pluginId = action
# Actions: false_positive | ignore | warn
#
# Find plugin IDs at: https://www.zaproxy.org/docs/alerts/
# Run: docker exec zap zap-cli alerts --risk high to list IDs

# ── Confirmed False Positives (Juice Shop) ──────────────────

# X-Content-Type-Options missing – handled by reverse proxy
10021 = false_positive

# Cookie without SameSite – Juice Shop dev cookies
10054 = false_positive

# Timestamp disclosure – Juice Shop intentional
10096 = false_positive

# ── Warn only (do not fail pipeline) ────────────────────────

# Content Security Policy not set – known Juice Shop behaviour
10038 = warn

# X-Frame-Options not set – acceptable for demo app
10020 = warn

# ── High severity – these WILL fail the pipeline ────────────
# (no entries here = all highs fail by default)
# To suppress a specific high: add its ID = false_positive

# SQL Injection – NEVER suppress (40018)
# XSS – NEVER suppress (40012, 40014)
# Path traversal – NEVER suppress (6)
